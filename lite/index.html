<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    Replaced at build time by the `--base-href` argument. The app is served
    from /app/ next to the landing page, not from the domain root, so this
    must not be hard-coded to "/" -- see scripts/build-web.ps1.
  -->
  <base href="/AIFA-app/lite/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AIFA — личный финансовый помощник. Записывайте траты одной фразой.">
  <meta name="theme-color" content="#E7E4DD">

  <!--
    google_sign_in_web reads the client id from this tag rather than from the
    Dart side, so the value has to reach the HTML somehow. The placeholder is
    substituted by scripts/build-web.ps1, which takes the id from
    AppConfig.googleServerClientId in app/lib/core/config.dart -- there is
    exactly one place to edit, and the build fails loudly if the substitution
    does not happen. Client ids are public by design; the secret lives on the
    backend.
  -->
  <meta name="google-signin-client_id" content="515094985652-sir8n4k4g1bu5n1gq97bs1hjg4k63s0f.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AIFA">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AIFA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The engine and app bundle are a few megabytes, so there is a real pause
      between the page arriving and the first Flutter frame. Without something
      here that pause is a blank white rectangle, which reads as a broken link
      -- especially coming from a button on the landing page.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #E7E4DD;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1C1917;
      transition: opacity .35s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .ring {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid rgba(28, 25, 23, .15);
      border-top-color: #D98E63;
      animation: spin 900ms linear infinite;
    }
    #boot .label {
      font-size: 14px;
      letter-spacing: .04em;
      color: #6b6560;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #boot .ring { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="ring"></div>
    <div class="label">Загружаем AIFA…</div>
  </div>

  <script>
    // Startup breadcrumbs from Dart (see core/platform/boot_beacon.dart). Read
    // window.__aifaBoot in the console to see how far main() got: the last
    // entry names the step that never finished.
    window.__aifaBoot = [];
    window.__aifaBootPush = function (entry) { window.__aifaBoot.push(entry); };
  </script>
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;

      function dismiss() {
        pauseCountdown();
        boot.classList.add('done');
        setTimeout(function () { boot.remove(); }, 400);
      }

      // Flutter fires this on the window once it has painted; fading the
      // splash then avoids a flash of half-built UI underneath it.
      window.addEventListener('flutter-first-frame', dismiss);

      // The splash covers the whole viewport, so if that event never arrives
      // it hides the app instead of merely preceding it. Watch for the engine
      // actually building a scene as a second, independent signal.
      // Waiting for the scene host to have CHILDREN, not merely to exist: the
      // element is created while the renderer starts up, long before anything
      // is drawn into it, so keying off its presence would pull the splash
      // away and reveal an empty canvas.
      var observer = new MutationObserver(function () {
        var host = document.querySelector('flt-scene-host');
        if (host && host.children.length > 0) {
          observer.disconnect();
          dismiss();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Last resort: say something instead of spinning forever. A renderer
      // that has not started after this long is not going to.
      //
      // The countdown only runs while the page is actually visible. Flutter
      // paints from requestAnimationFrame, which browsers do not fire for a
      // hidden or background tab -- so a perfectly healthy app opened in a
      // background tab would otherwise accuse itself of having failed by the
      // time the user switched to it.
      var timer = null;

      function giveUp() {
        if (!document.getElementById('boot')) return;
        var label = boot.querySelector('.label');
        if (label) {
          label.innerHTML =
            'Не удалось загрузить приложение.<br>Обновите страницу — ' +
            'если не помогает, попробуйте другой браузер.';
        }
        var ring = boot.querySelector('.ring');
        if (ring) ring.style.display = 'none';
      }

      function startCountdown() {
        if (timer === null && !document.hidden) {
          timer = setTimeout(giveUp, 25000);
        }
      }

      function pauseCountdown() {
        if (timer !== null) {
          clearTimeout(timer);
          timer = null;
        }
      }

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          pauseCountdown();
        } else {
          startCountdown();
        }
      });
      startCountdown();
    })();
  </script>
  <script>
    // Keyboard watchdog. Flutter web sizes the app from the visual viewport,
    // but while a text field is being edited on a phone it deliberately keeps
    // the OLD size and reports the keyboard as an inset instead. If the
    // viewport changed at an unlucky moment -- a frame rendered after the
    // field lost focus but before the keyboard finished sliding away, or the
    // keyboard was hidden while the field kept focus (Android back key,
    // Telegram's in-app browser) -- the engine is left holding the
    // keyboard-sized height, and the browser never sends another resize. The
    // app then sits in the top half of the screen above an empty grey strip
    // until something else resizes the window.
    //
    // So: whenever the app's box disagrees with the size the engine itself
    // would measure, and nothing is being typed, replay a resize event. The
    // engine's own handler then re-measures. A short-height box with a field
    // still focused but the keyboard already gone can only be stale, so that
    // field is blurred first (the keyboard is not on screen anyway).
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      // The engine only freezes its size for the keyboard on phones.
      var mobile = ios || /Android/i.test(navigator.userAgent);
      var retries = 0;

      function editingElement() {
        var el = document.activeElement;
        if (!el || !el.closest) return null;
        if (!el.closest('flt-text-editing-host')) return null;
        return /^(INPUT|TEXTAREA)$/.test(el.tagName) ? el : null;
      }

      function check() {
        var view = document.querySelector('flutter-view');
        if (!view) return;
        var box = view.getBoundingClientRect();
        // The same numbers the engine's FullPageDimensionsProvider reads.
        var h = ios ? document.documentElement.clientHeight : vv.height;
        var w = ios ? document.documentElement.clientWidth : vv.width;
        var editing = editingElement();
        var stale;
        if (editing && !mobile) return;
        if (editing) {
          // Mid-edit the box is SUPPOSED to stay taller than the viewport
          // (keyboard up). Shorter than the viewport is never right.
          stale = box.height < h - 2;
          if (stale) editing.blur();
        } else {
          stale = Math.abs(box.height - h) > 2 || Math.abs(box.width - w) > 2;
        }
        if (!stale) {
          retries = 0;
          return;
        }
        // Bounded, so a layout the engine measures differently from us can
        // never turn this into a resize loop.
        if (retries >= 3) return;
        retries++;
        vv.dispatchEvent(new Event('resize'));
      }

      var pending = [];
      function soon() {
        // The keyboard animates for ~250-400 ms and focus moves before it
        // ends, so look again after it has settled.
        pending.forEach(clearTimeout);
        retries = 0;
        pending = [120, 450, 1000].map(function (ms) {
          return setTimeout(check, ms);
        });
      }

      vv.addEventListener('resize', function (e) {
        if (e.isTrusted) soon();
      });
      window.addEventListener('resize', soon);
      window.addEventListener('orientationchange', soon);
      document.addEventListener('focusout', soon, true);
      document.addEventListener('focusin', soon, true);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) soon();
      });
      // A low-rate safety net for WebViews that drop the resize event
      // entirely; when the sizes agree this is one layout read.
      setInterval(check, 1500);
    })();
  </script>
  <script>
    // «Ещё → Установить как приложение» (core/platform/install_app_web.dart).
    // Chrome, Edge and Samsung Internet fire beforeinstallprompt once, early,
    // and only that event can open their install dialog later, so it is kept
    // here before Flutter has even started. Not preventDefault()-ed: the
    // browser's own install hint stays as it was.
    (function () {
      var deferred = null;
      window.addEventListener('beforeinstallprompt', function (e) { deferred = e; });
      window.addEventListener('appinstalled', function () { deferred = null; });
      window.__aifaInstallMode = function () {
        var standalone = navigator.standalone === true ||
            (window.matchMedia && (matchMedia('(display-mode: standalone)').matches ||
                matchMedia('(display-mode: window-controls-overlay)').matches));
        if (standalone) return 'installed';
        return deferred ? 'prompt' : 'guide';
      };
      window.__aifaInstallPrompt = function () {
        if (!deferred) return Promise.resolve('unavailable');
        var e = deferred;
        deferred = null;
        return Promise.resolve(e.prompt())
          .then(function () { return e.userChoice; })
          .then(function (c) { return (c && c.outcome) || 'dismissed'; })
          .catch(function () { return 'unavailable'; });
      };
    })();
  </script>
  <script>
    // Notifications (Web Push). core/platform/web_push_web.dart drives this;
    // the worker is web/aifa_sw.js. iPhone has Web Push only in the app
    // added to the home screen (iOS 16.4+): in Safari itself PushManager is
    // missing, which state() reports as 'needs-install'.
    (function () {
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true ||
          (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      var supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      var reg = null;
      if (supported) {
        reg = navigator.serviceWorker.register('aifa_sw.js').catch(function () { return null; });
      }
      function key(b64) {
        var s = (b64 + '='.repeat((4 - b64.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(s), out = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }
      function current() {
        if (!reg) return Promise.resolve(null);
        return reg.then(function (r) { return r ? r.pushManager.getSubscription() : null; });
      }
      window.__aifaPush = {
        state: function () {
          if (!supported) return ios && !standalone ? 'needs-install' : 'unsupported';
          return Notification.permission; // default | granted | denied
        },
        // Must be the first thing a tap does: Safari only asks inside the
        // user's gesture.
        ask: function () {
          if (!supported) return Promise.resolve('unsupported');
          return Promise.resolve(Notification.requestPermission());
        },
        // The subscription JSON for the server, '' when not allowed.
        subscribe: function (publicKey) {
          if (!supported || Notification.permission !== 'granted' || !publicKey) return Promise.resolve('');
          return current().then(function (sub) {
            if (sub) {
              var k = sub.options && sub.options.applicationServerKey;
              var same = k && btoa(String.fromCharCode.apply(null, new Uint8Array(k)))
                  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') === publicKey;
              if (same) return sub;
              return sub.unsubscribe().then(function () { return null; });
            }
            return null;
          }).then(function (sub) {
            if (sub) return sub;
            return reg.then(function (r) {
              return r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key(publicKey) });
            });
          }).then(function (sub) { return sub ? JSON.stringify(sub) : ''; })
            .catch(function () { return ''; });
        }
      };
      // A tap on a notification: from the worker while the app is open, or
      // ?push_open= when it opened the app. Kept until Dart takes it.
      var pending = [];
      var handler = null;
      function deliver(open) { if (handler) handler(open); else pending.push(open); }
      var q = (location.search.match(/[?&]push_open=([^&]*)/) || [])[1];
      if (q !== undefined) deliver(decodeURIComponent(q));
      if (supported) {
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && typeof e.data.aifaPushOpen === 'string') deliver(e.data.aifaPushOpen);
        });
      }
      window.__aifaOnPushOpen = function (f) {
        handler = f;
        while (pending.length) f(pending.shift());
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
